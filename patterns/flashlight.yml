# Rotate a portion of the image and make it stand out
macros:
  macro_saturation=1.5

processors:
  - name: face spin
    command: "spin 53 60 -28 30"
  - name: darken
    command: "rgb = (r/macro_saturation, g/macro_saturation, b/macro_saturation)"
  - name: lighten
    command: "rgb offset 53 60 30 = (r * macro_saturation, g * macro_saturation, b * macro_saturation)"
