# Create a wave and colors
macros:
  macro_center_x=0.52 * (W - 1)
  macro_center_y=0.77 * (H - 1)
  macro_radius=sqrt(pow(X - macro_center_x, 2) + pow(Y - macro_center_y, 2))
  macro_angle=atan2(Y - macro_center_y, X - macro_center_x)
  macro_radial_scale=0.992 + 0.006 * sin(5 * macro_angle)
  macro_twist=0.003 * sin(macro_radius / (0.02018 * min(W, H)))
steps:
  - name: waves
    command: >
      loop-warp 10 = (
      macro_center_x + macro_radius * macro_radial_scale * cos(macro_angle + macro_twist),
      macro_center_y + macro_radius * macro_radial_scale * sin(macro_angle + macro_twist)
      )
  - name: colors
    command: >
      rgb offset 52 77 = (
      0.9 * R + 0.1 * B,
      G + 16 * sin(D / (0.01298 * min(W, H))),
      B + 24 * cos(5 * A)
      )
  - name: saturation
    command: "s = S * 1.25"
