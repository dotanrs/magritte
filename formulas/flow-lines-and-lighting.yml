# Layer formula-driven streamlines and a lighting preset over a background.
canvas:
  file_name: "flow-lines-and-lighting.jpg"
  width: 480
  height: 480
macros:
  macro_vertical_gradient=1 + V
processors:
  - name: midnight background
    command: "rgb = (10 + 12 * macro_vertical_gradient, 18 + 18 * macro_vertical_gradient, 42 + 30 * macro_vertical_gradient)"
  - name: circular streamlines
    command: "flow-lines 24 600 1.2 1.4 #E7B94B 0.85 = (-V, U)"
  - name: cool directional light
    command: "lighting moonlight 0.65"
